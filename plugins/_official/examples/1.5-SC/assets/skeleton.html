<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><!-- AGENT: set title --></title>

  <!-- ===== FONTS (do not modify) ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Open+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- ===== VUE + ROUTER CDN (do not modify) ===== -->
  <!-- Global builds (not ESM) for sandboxed iframe compatibility -->
  <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/vue-router@4.5.0/dist/vue-router.global.prod.js"></script>

  <style>
    /* =================================================================
       DESIGN TOKENS — :root block
       ----------------------------------------------------------------
       AGENT: PASTE THE ACTIVE DESIGN SYSTEM'S tokens.css :root BLOCK
       HERE before generating the prototype. The skeleton's own :root
       below contains only skeleton-layout tokens (nav height, sidebar
       width, page margin) + a fallback for --info which is not in the
       standard schema.

       DO NOT hard-code hex values or px values outside of :root.
       Every component class below references var(--*) exclusively.
       ================================================================= */

    :root {
      /* ─── Diginex Library v4.0.0 tokens (Nuxt UI v4 / Tailwind v4) ──── */
      /* Surface */
      --bg: #ffffff;
      --surface: #f8fafc;       /* neutral-50 — elevated card surfaces */
      --surface-warm: #f1f5f9;  /* neutral-100 — accented / secondary surfaces */

      /* Foreground ramp (Tailwind slate) */
      --fg: #314158;       /* neutral-700 — primary text */
      --fg-2: #45556c;     /* neutral-600 — emphasised secondary text */
      --muted: #64748e;    /* neutral-500 — secondary body text */
      --meta: #90a1b9;     /* neutral-400 — tertiary text, metadata */

      /* Border */
      --border: #e2e8f0;     /* neutral-200 — standard hairline border */
      --border-soft: #cad5e2; /* neutral-300 — emphasised / section dividers */

      /* Accent (lilac-3) */
      --accent: #8171d7;     /* primary-500 — lilac-3 */
      --accent-on: #ffffff;  /* fg when accent is the bg */
      --accent-hover: color-mix(in oklab, var(--accent), black 8%);
      --accent-active: color-mix(in oklab, var(--accent), black 14%);

      /* Secondary (orange-3) */
      --secondary: #e66b1a;     /* secondary-500 — orange-3 */
      --secondary-on: #ffffff;

      /* Semantic (A2) */
      --success: #00c16a;  /* green-500 */
      --info: #2b7fff;     /* blue-500 */
      --warn: #efb100;     /* yellow-500 */
      --danger: #fb2c36;   /* red-500 */

      /* Typography */
      --font-display: 'DM Sans', 'Open Sans', ui-sans-serif, system-ui, sans-serif;
      --font-body: 'Open Sans', 'Public Sans', ui-sans-serif, system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;

      --text-xs: 12px;
      --text-sm: 14px;
      --text-base: 16px;
      --text-lg: 18px;
      --text-xl: 20px;
      --text-2xl: 24px;
      --text-3xl: 30px;
      --text-4xl: 36px;

      --leading-body: 1.5;
      --leading-tight: 1.2;
      --tracking-display: -0.01em;

      /* Spacing (Tailwind v4 scale) */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;
      --space-12: 48px;

      --section-y-desktop: 80px;
      --section-y-tablet: 64px;
      --section-y-phone: 48px;

      /* Radius — base ui-radius 4px, button radius 3px */
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --radius-pill: 9999px;
      --radius-btn: 3px;     /* button-specific radius (v4.0.0) */

      /* Elevation — ring-based depth */
      --elev-flat: none;
      --elev-ring: 0 0 0 1px var(--border);
      --elev-raised: rgba(15, 23, 43, 0.05) 0px 4px 24px;

      /* Focus ring — lilac-3 */
      --focus-ring: 0 0 0 3px rgba(129, 113, 215, 0.3);

      /* Motion */
      --motion-fast: 150ms;
      --motion-base: 200ms;
      --ease-standard: cubic-bezier(0.2, 0, 0, 1);

      /* Layout */
      --container-max: 1200px;
      --container-gutter-desktop: 24px;
      --container-gutter-tablet: 16px;
      --container-gutter-phone: 12px;

      /* ─── Skeleton-layout tokens (not from design system) ─────────── */
      --nav-height: 56px;
      --sidebar-width: 240px;
      --page-margin: var(--space-10, 40px);
    }

    /* =================================================================
       RESET (do not modify)
       ================================================================= */

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: var(--leading-body);
      color: var(--fg);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #app {
      min-height: 100vh;
    }

    /* =================================================================
       ROUTE TRANSITIONS
       ================================================================= */

    .fade-enter-active,
    .fade-leave-active {
      transition: opacity 200ms ease;
    }
    .fade-enter-from,
    .fade-leave-to {
      opacity: 0;
    }

    /* =================================================================
       NAVIGATION — TOP BAR
       ================================================================= */

    .app-nav-top {
      display: flex;
      align-items: center;
      height: var(--nav-height);
      padding: 0 var(--page-margin);
      background: var(--surface);
      border-bottom: 1px solid var(--border-soft);
      gap: var(--space-8);
    }

    .app-nav-top .nav-brand {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-right: auto;
    }

    .app-nav-top .nav-logo {
      height: 28px;
      width: auto;
    }

    .app-nav-top .nav-title {
      font-family: var(--font-display);
      font-size: var(--text-base);
      font-weight: 600;
      color: var(--fg);
    }

    .app-nav-top .nav-links {
      display: flex;
      gap: var(--space-1);
    }

    .app-nav-top .nav-link {
      display: inline-flex;
      align-items: center;
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--fg-2);
      text-decoration: none;
      transition: background 120ms ease, color 120ms ease;
      cursor: pointer;
      border: none;
      background: none;
    }

    .app-nav-top .nav-link:hover {
      background: color-mix(in oklab, var(--fg), transparent 94%);
      color: var(--fg);
    }

    .app-nav-top .nav-link.router-link-active,
    .app-nav-top .nav-link.router-link-exact-active {
      background: color-mix(in oklab, var(--accent), transparent 90%);
      color: var(--accent);
    }

    /* =================================================================
       NAVIGATION — SIDEBAR
       ================================================================= */

    .app-layout-sidebar {
      display: flex;
      min-height: 100vh;
    }

    .app-nav-sidebar {
      width: var(--sidebar-width);
      background: var(--surface);
      border-right: 1px solid var(--border-soft);
      display: flex;
      flex-direction: column;
      padding: var(--space-6) 0;
      flex-shrink: 0;
    }

    .app-nav-sidebar .nav-brand {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: 0 var(--space-6) var(--space-6);
      border-bottom: 1px solid var(--border-soft);
      margin-bottom: var(--space-4);
    }

    .app-nav-sidebar .nav-logo {
      height: 28px;
      width: auto;
    }

    .app-nav-sidebar .nav-title {
      font-family: var(--font-display);
      font-size: var(--text-base);
      font-weight: 600;
      color: var(--fg);
    }

    .app-nav-sidebar .nav-links {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
      padding: 0 var(--space-3);
    }

    .app-nav-sidebar .nav-link {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--fg-2);
      text-decoration: none;
      transition: background 120ms ease, color 120ms ease;
      cursor: pointer;
      border: none;
      background: none;
      text-align: left;
    }

    .app-nav-sidebar .nav-link:hover {
      background: color-mix(in oklab, var(--fg), transparent 94%);
      color: var(--fg);
    }

    .app-nav-sidebar .nav-link.router-link-active,
    .app-nav-sidebar .nav-link.router-link-exact-active {
      background: color-mix(in oklab, var(--accent), transparent 90%);
      color: var(--accent);
    }

    .app-content-sidebar {
      flex: 1;
      padding: var(--space-8);
      max-width: var(--container-max);
    }

    /* =================================================================
       SHARED COMPONENT STYLES
       Use these classes in your route components.
       Every value references var(--*) — never raw hex or px.
       ================================================================= */

    /* Screen header */
    .screen-header {
      margin-bottom: var(--space-8);
    }
    .screen-header h1 {
      font-family: var(--font-display);
      font-size: var(--text-4xl);
      font-weight: 700;
      line-height: var(--leading-tight);
      letter-spacing: var(--tracking-display);
      color: var(--fg);
      margin-bottom: var(--space-2);
    }
    .screen-header .subtitle {
      font-family: var(--font-body);
      font-size: var(--text-base);
      font-weight: 400;
      color: var(--fg-2);
    }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--space-5);
      box-shadow: var(--elev-raised);
    }

    /* KPI grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: var(--space-4);
      margin-bottom: var(--space-8);
    }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--space-5);
      box-shadow: var(--elev-raised);
    }

    .kpi-value {
      display: block;
      font-family: var(--font-display);
      font-size: var(--text-3xl);
      font-weight: 600;
      line-height: var(--leading-tight);
      letter-spacing: var(--tracking-display);
      color: var(--fg);
      margin-bottom: var(--space-1);
    }

    .kpi-label {
      display: block;
      font-family: var(--font-body);
      font-size: var(--text-xs);
      font-weight: 400;
      color: var(--fg-2);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .kpi-change {
      display: inline-block;
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 600;
      margin-top: var(--space-2);
    }
    .kpi-change.up { color: var(--success); }
    .kpi-change.down { color: var(--danger); }
    .kpi-change.neutral { color: var(--fg-2); }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 500;
      cursor: pointer;
      transition: background 120ms ease, transform 80ms ease;
      text-decoration: none;
    }
    .btn:active { transform: scale(0.98); }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-on);
      padding: 10px 20px;
      border-radius: var(--radius-btn);
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:active { background: var(--accent-active); }

    .btn-ghost {
      background: color-mix(in oklab, var(--accent), transparent 90%);
      color: var(--accent);
      padding: 10px 20px;
      border-radius: var(--radius-btn);
    }
    .btn-ghost:hover {
      background: color-mix(in oklab, var(--accent), transparent 84%);
    }

    .btn-default {
      background: var(--accent);
      color: var(--accent-on);
      padding: 6px 16px;
      border-radius: var(--radius-btn);
    }
    .btn-default:hover { background: var(--accent-hover); }

    .btn-small {
      background: var(--accent);
      color: var(--accent-on);
      padding: 4px 12px;
      border-radius: var(--radius-btn);
      font-size: var(--text-xs);
    }

    .btn-danger {
      background: var(--danger);
      color: var(--accent-on);
      padding: 6px 16px;
      border-radius: var(--radius-btn);
    }
    .btn-danger:hover {
      background: color-mix(in oklab, var(--danger), black 14%);
    }

    .btn:disabled,
    .btn[disabled] {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Forms */
    .form-group {
      margin-bottom: var(--space-4);
    }
    .form-label {
      display: block;
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--fg);
      margin-bottom: var(--space-2);
    }
    .form-input {
      width: 100%;
      height: 36px;
      padding: var(--space-2) var(--space-3);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: var(--text-base);
      color: var(--fg);
      transition: border-color 120ms ease;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: var(--focus-ring);
    }
    .form-input::placeholder {
      color: var(--meta);
    }
    .form-input.error {
      border-color: var(--danger);
    }

    /* Tags / Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: var(--text-xs);
      font-weight: 400;
    }
    .badge-success {
      background: color-mix(in oklab, var(--success), transparent 88%);
      color: var(--success);
    }
    .badge-warning {
      background: color-mix(in oklab, var(--warn), transparent 88%);
      color: var(--warn);
    }
    .badge-error {
      background: color-mix(in oklab, var(--danger), transparent 88%);
      color: var(--danger);
    }
    .badge-info {
      background: color-mix(in oklab, var(--info), transparent 88%);
      color: var(--info);
    }
    .badge-neutral {
      background: color-mix(in oklab, var(--fg), transparent 94%);
      color: var(--fg-2);
    }

    /* Tables */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-body);
      font-size: var(--text-base);
    }
    .data-table th {
      text-align: left;
      padding: var(--space-3) var(--space-4);
      font-size: var(--text-xs);
      font-weight: 400;
      color: var(--fg-2);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }
    .data-table th:hover { color: var(--fg); }
    .data-table th.sorted { color: var(--accent); }
    .data-table td {
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--border-soft);
      color: var(--fg);
    }
    .data-table tr:hover td {
      background: color-mix(in oklab, var(--surface), var(--bg) 50%);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: var(--space-8);
      box-shadow: var(--elev-raised);
      max-width: 520px;
      width: 90vw;
    }
    .modal-header {
      font-family: var(--font-display);
      font-size: var(--text-xl);
      font-weight: 600;
      margin-bottom: var(--space-4);
    }
    .modal-body {
      font-family: var(--font-body);
      font-size: var(--text-base);
      color: var(--fg-2);
      margin-bottom: var(--space-6);
    }
    .modal-actions {
      display: flex;
      gap: var(--space-3);
      justify-content: flex-end;
    }

    /* Tabs (within a screen) */
    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: var(--space-6);
    }
    .tab {
      padding: var(--space-3) var(--space-4);
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--fg-2);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: color 120ms ease, border-color 120ms ease;
    }
    .tab:hover { color: var(--fg); }
    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* Status indicators */
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: var(--space-2);
    }
    .status-dot.success { background: var(--success); }
    .status-dot.warning { background: var(--warn); }
    .status-dot.error { background: var(--danger); }
    .status-dot.neutral { background: var(--meta); }

    /* State toggle bar (design spec controls — AGENT: include on every screen) */
    .state-toggles {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-4);
      background: color-mix(in oklab, var(--fg), transparent 94%);
      border-bottom: 1px solid var(--border);
      margin-bottom: var(--space-6);
      border-radius: var(--radius-sm);
    }
    .state-toggles .toggle-label {
      font-family: var(--font-body);
      font-size: var(--text-xs);
      font-weight: 400;
      color: var(--fg-2);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-right: var(--space-3);
    }
    .state-toggles button {
      padding: var(--space-1) var(--space-3);
      font-family: var(--font-body);
      font-size: var(--text-xs);
      font-weight: 400;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--fg-2);
      cursor: pointer;
      transition: all 120ms ease;
    }
    .state-toggles button:hover {
      border-color: var(--border);
      color: var(--fg);
    }
    .state-toggles button.active {
      background: var(--accent);
      color: var(--accent-on);
      border-color: var(--accent);
    }

    /* Skeleton loading placeholder */
    .skeleton-block {
      background: linear-gradient(
        90deg,
        color-mix(in oklab, var(--fg), transparent 94%) 25%,
        var(--border-soft) 50%,
        color-mix(in oklab, var(--fg), transparent 94%) 75%
      );
      background-size: 200% 100%;
      animation: skeleton-pulse 1.5s ease-in-out infinite;
      border-radius: var(--radius-sm);
    }
    @keyframes skeleton-pulse {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: var(--space-6);
      right: var(--space-6);
      padding: var(--space-3) var(--space-5);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--accent-on);
      z-index: 200;
      animation: toast-in 200ms ease;
    }
    .toast-success { background: var(--success); }
    .toast-error { background: var(--danger); }
    .toast-info { background: var(--info); }

    @keyframes toast-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* =================================================================
       SCREEN-SPECIFIC CSS — AGENT: add screen styles below
       ================================================================= */

    /* AGENT: add .screen-<name> styles here */

    /* =================================================================
       RESPONSIVE
       ================================================================= */

    @media (max-width: 768px) {
      :root {
        --page-margin: var(--space-6);
        --sidebar-width: 0;
      }
      .app-nav-top {
        padding: 0 var(--space-4);
        gap: var(--space-4);
      }
      .app-nav-sidebar {
        display: none;
      }
      .app-content-sidebar {
        padding: var(--space-4);
      }
      .kpi-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- ⚠️ CRITICAL: #app must be EMPTY. Vue 3 replaces #app innerHTML with the root component's render output. Do NOT put HTML, nav, or router-view here — put them in the root component's template (see "ROUTER + APP" section below). A root component without template renders <!---->, causing a blank page with no console error. -->
  <div id="app" data-od-id="app-root"></div>

  <script>
    const { createApp, reactive, ref, computed, watch, nextTick } = Vue;
    const { createRouter, createWebHashHistory } = VueRouter;

    // =================================================================
    // AGENT: Define route components below.
    // Each component = { template: `...`, setup() { ... } }
    //
    // Template must use the CSS classes from the <style> block above
    // (card, kpi-grid, btn, badge, data-table, form-input, tabs, etc).
    // Do NOT redefine these classes. Do NOT write raw hex or px values.
    // Use var(--token) for any custom inline styles.
    //
    // Every interactive element must do something visible:
    // buttons → show toast or navigate, forms → v-model + submit handler,
    // tables → sortable columns, tabs → toggle content, modals → open/close.
    //
    // Add data-od-id to: state toggle bar ("state-toggles"), each screen-header,
    // and each card/section — required for critique mode compatibility.
    // =================================================================
