  <style>
    /* =================================================================
       DESIGN TOKENS — :root block
       Diginex Library v4.0.0 (Nuxt UI v4 / Tailwind v4)
       ================================================================= */

    :root {
      /* Surface */
      --bg: #ffffff;
      --surface: #f8fafc;       /* neutral-50 — elevated card surfaces */
      --surface-warm: #f1f5f9;  /* neutral-100 — accented / secondary surfaces */

      /* Foreground ramp (Tailwind slate) */
      --fg: #314158;       /* neutral-700 — primary text */
      --fg-2: #45556c;     /* neutral-600 — emphasised secondary text */
      --muted: #64748e;    /* neutral-500 — secondary body text */
      --meta: #90a1b9;     /* neutral-400 — tertiary text, metadata */

      /* Border */
      --border: #e2e8f0;     /* neutral-200 — standard hairline border */
      --border-soft: #cad5e2; /* neutral-300 — emphasised / section dividers */

      /* Accent (lilac-3) */
      --accent: #8171d7;     /* primary-500 — lilac-3 */
      --accent-on: #ffffff;  /* fg when accent is the bg */
      --accent-hover: color-mix(in oklab, var(--accent), black 8%);
      --accent-active: color-mix(in oklab, var(--accent), black 14%);

      /* Secondary (orange-3) */
      --secondary: #e66b1a;     /* secondary-500 — orange-3 */
      --secondary-on: #ffffff;

      /* Semantic (A2) */
      --success: #00c16a;  /* green-500 */
      --info: #2b7fff;     /* blue-500 */
      --warn: #efb100;     /* yellow-500 */
      --danger: #fb2c36;   /* red-500 */

      /* Typography */
      --font-display: 'DM Sans', 'Open Sans', ui-sans-serif, system-ui, sans-serif;
      --font-body: 'Open Sans', 'Public Sans', ui-sans-serif, system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;

      --text-xs: 12px;
      --text-sm: 14px;
      --text-base: 16px;
      --text-lg: 18px;
      --text-xl: 20px;
      --text-2xl: 24px;
      --text-3xl: 30px;
      --text-4xl: 36px;

      --leading-body: 1.5;
      --leading-tight: 1.2;
      --tracking-display: -0.01em;

      /* Spacing (Tailwind v4 scale) */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;
      --space-12: 48px;

      --section-y-desktop: 80px;
      --section-y-tablet: 64px;
      --section-y-phone: 48px;

      /* Radius — base ui-radius 4px, button radius 3px */
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --radius-pill: 9999px;
      --radius-btn: 3px;     /* button-specific radius (v4.0.0) */

      /* Elevation — ring-based depth */
      --elev-flat: none;
      --elev-ring: 0 0 0 1px var(--border);
      --elev-raised: rgba(15, 23, 43, 0.05) 0px 4px 24px;

      /* Focus ring — lilac-3 */
      --focus-ring: 0 0 0 3px rgba(129, 113, 215, 0.3);

      /* Motion */
      --motion-fast: 150ms;
      --motion-base: 200ms;
      --ease-standard: cubic-bezier(0.2, 0, 0, 1);

      /* Layout */
      --container-max: 1200px;
      --container-gutter-desktop: 24px;
      --container-gutter-tablet: 16px;
      --container-gutter-phone: 12px;

      /* ─── Skeleton-layout tokens (not from design system) ─────────── */
      --nav-height: 56px;
      --sidebar-width: 240px;
      --page-margin: var(--space-10, 40px);
    }

    /* =================================================================
       RESET (do not modify)
       ================================================================= */

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: var(--leading-body);
      color: var(--fg);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #app {
      min-height: 100vh;
    }

    /* =================================================================
       ROUTE TRANSITIONS
       ================================================================= */

    .fade-enter-active,
    .fade-leave-active {
      transition: opacity 200ms ease;
    }
    .fade-enter-from,
    .fade-leave-to {
      opacity: 0;
    }

    /* =================================================================
       NAVIGATION — TOP BAR
       ================================================================= */

    .app-nav-top {
      display: flex;
      align-items: center;
      height: var(--nav-height);
      padding: 0 var(--page-margin);
      background: var(--surface);
      border-bottom: 1px solid var(--border-soft);
      gap: var(--space-8);
    }

    .app-nav-top .nav-brand {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-right: auto;
    }

    .app-nav-top .nav-logo {
      height: 28px;
      width: auto;
    }

    .app-nav-top .nav-title {
      font-family: var(--font-display);
      font-size: var(--text-base);
      font-weight: 600;
      color: var(--fg);
    }

    .app-nav-top .nav-links {
      display: flex;
      gap: var(--space-1);
    }

    .app-nav-top .nav-link {
      display: inline-flex;
      align-items: center;
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--fg-2);
      text-decoration: none;
      transition: background 120ms ease, color 120ms ease;
      cursor: pointer;
      border: none;
      background: none;
    }

    .app-nav-top .nav-link:hover {
      background: color-mix(in oklab, var(--fg), transparent 94%);
      color: var(--fg);
    }

    .app-nav-top .nav-link.router-link-active,
    .app-nav-top .nav-link.router-link-exact-active {
      background: color-mix(in oklab, var(--accent), transparent 90%);
      color: var(--accent);
    }

    /* =================================================================
       NAVIGATION — SIDEBAR
       ================================================================= */

    .app-layout-sidebar {
      display: flex;
      min-height: 100vh;
    }

    .app-nav-sidebar {
      width: var(--sidebar-width);
      background: var(--surface);
      border-right: 1px solid var(--border-soft);
      display: flex;
      flex-direction: column;
      padding: var(--space-6) 0;
      flex-shrink: 0;
    }

    .app-nav-sidebar .nav-brand {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: 0 var(--space-6) var(--space-6);
      border-bottom: 1px solid var(--border-soft);
      margin-bottom: var(--space-4);
    }

    .app-nav-sidebar .nav-logo {
      height: 28px;
      width: auto;
    }

    .app-nav-sidebar .nav-title {
      font-family: var(--font-display);
      font-size: var(--text-base);
      font-weight: 600;
      color: var(--fg);
    }

    .app-nav-sidebar .nav-links {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
      padding: 0 var(--space-3);
    }

    .app-nav-sidebar .nav-link {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--fg-2);
      text-decoration: none;
      transition: background 120ms ease, color 120ms ease;
      cursor: pointer;
      border: none;
      background: none;
      text-align: left;
    }

    .app-nav-sidebar .nav-link:hover {
      background: color-mix(in oklab, var(--fg), transparent 94%);
      color: var(--fg);
    }

    .app-nav-sidebar .nav-link.router-link-active,
    .app-nav-sidebar .nav-link.router-link-exact-active {
      background: color-mix(in oklab, var(--accent), transparent 90%);
      color: var(--accent);
    }

    .app-nav-sidebar .nav-section-label {
      padding: var(--space-4) var(--space-3) var(--space-1);
      font-family: var(--font-body);
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--meta);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .app-nav-sidebar .nav-footer {
      margin-top: auto;
      padding: var(--space-4) var(--space-5);
      border-top: 1px solid var(--border-soft);
      font-family: var(--font-body);
      font-size: var(--text-xs);
      color: var(--meta);
    }

    .app-content-sidebar {
      flex: 1;
      padding: var(--space-8);
      max-width: var(--container-max);
    }

    /* =================================================================
       SHARED COMPONENT STYLES
       ================================================================= */

    .screen-header {
      margin-bottom: var(--space-8);
    }
    .screen-header h1 {
      font-family: var(--font-display);
      font-size: var(--text-4xl);
      font-weight: 700;
      line-height: var(--leading-tight);
      letter-spacing: var(--tracking-display);
      color: var(--fg);
      margin-bottom: var(--space-2);
    }
    .screen-header .subtitle {
      font-family: var(--font-body);
      font-size: var(--text-base);
      font-weight: 400;
      color: var(--fg-2);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--space-5);
      box-shadow: var(--elev-raised);
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: var(--space-4);
      margin-bottom: var(--space-8);
    }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--space-5);
      box-shadow: var(--elev-raised);
    }

    .kpi-value {
      display: block;
      font-family: var(--font-display);
      font-size: var(--text-3xl);
      font-weight: 600;
      line-height: var(--leading-tight);
      letter-spacing: var(--tracking-display);
      color: var(--fg);
      margin-bottom: var(--space-1);
    }

    .kpi-label {
      display: block;
      font-family: var(--font-body);
      font-size: var(--text-xs);
      font-weight: 400;
      color: var(--fg-2);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .kpi-change {
      display: inline-block;
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 600;
      margin-top: var(--space-2);
    }
    .kpi-change.up { color: var(--success); }
    .kpi-change.down { color: var(--danger); }
    .kpi-change.neutral { color: var(--fg-2); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 500;
      cursor: pointer;
      transition: background 120ms ease, transform 80ms ease;
      text-decoration: none;
    }
    .btn:active { transform: scale(0.98); }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-on);
      padding: 10px 20px;
      border-radius: var(--radius-btn);
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:active { background: var(--accent-active); }

    .btn-ghost {
      background: color-mix(in oklab, var(--accent), transparent 90%);
      color: var(--accent);
      padding: 10px 20px;
      border-radius: var(--radius-btn);
    }
    .btn-ghost:hover {
      background: color-mix(in oklab, var(--accent), transparent 84%);
    }

    .btn-default {
      background: var(--accent);
      color: var(--accent-on);
      padding: 6px 16px;
      border-radius: var(--radius-btn);
    }
    .btn-default:hover { background: var(--accent-hover); }

    .btn-small {
      background: var(--accent);
      color: var(--accent-on);
      padding: 4px 12px;
      border-radius: var(--radius-btn);
      font-size: var(--text-xs);
    }

    .btn-danger {
      background: var(--danger);
      color: var(--accent-on);
      padding: 6px 16px;
      border-radius: var(--radius-btn);
    }
    .btn-danger:hover {
      background: color-mix(in oklab, var(--danger), black 14%);
    }

    .btn:disabled,
    .btn[disabled] {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .form-group {
      margin-bottom: var(--space-4);
    }
    .form-label {
      display: block;
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--fg);
      margin-bottom: var(--space-2);
    }
    .form-input {
      width: 100%;
      height: 36px;
      padding: var(--space-2) var(--space-3);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: var(--text-base);
      color: var(--fg);
      transition: border-color 120ms ease;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: var(--focus-ring);
    }
    .form-input::placeholder {
      color: var(--meta);
    }
    .form-input.error {
      border-color: var(--danger);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: var(--text-xs);
      font-weight: 400;
    }
    .badge-success {
      background: color-mix(in oklab, var(--success), transparent 88%);
      color: var(--success);
    }
    .badge-warning {
      background: color-mix(in oklab, var(--warn), transparent 88%);
      color: var(--warn);
    }
    .badge-error {
      background: color-mix(in oklab, var(--danger), transparent 88%);
      color: var(--danger);
    }
    .badge-info {
      background: color-mix(in oklab, var(--info), transparent 88%);
      color: var(--info);
    }
    .badge-neutral {
      background: color-mix(in oklab, var(--fg), transparent 94%);
      color: var(--fg-2);
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-body);
      font-size: var(--text-base);
    }
    .data-table th {
      text-align: left;
      padding: var(--space-3) var(--space-4);
      font-size: var(--text-xs);
      font-weight: 400;
      color: var(--fg-2);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }
    .data-table th:hover { color: var(--fg); }
    .data-table th.sorted { color: var(--accent); }
    .data-table td {
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--border-soft);
      color: var(--fg);
    }
    .data-table tr:hover td {
      background: color-mix(in oklab, var(--surface), var(--bg) 50%);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: var(--space-8);
      box-shadow: var(--elev-raised);
      max-width: 520px;
      width: 90vw;
    }
    .modal-header {
      font-family: var(--font-display);
      font-size: var(--text-xl);
      font-weight: 600;
      margin-bottom: var(--space-4);
    }
    .modal-body {
      font-family: var(--font-body);
      font-size: var(--text-base);
      color: var(--fg-2);
      margin-bottom: var(--space-6);
    }
    .modal-actions {
      display: flex;
      gap: var(--space-3);
      justify-content: flex-end;
    }

    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: var(--space-6);
      flex-wrap: wrap;
    }
    .tab {
      padding: var(--space-3) var(--space-4);
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--fg-2);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: color 120ms ease, border-color 120ms ease;
    }
    .tab:hover { color: var(--fg); }
    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: var(--space-2);
    }
    .status-dot.success { background: var(--success); }
    .status-dot.warning { background: var(--warn); }
    .status-dot.error { background: var(--danger); }
    .status-dot.neutral { background: var(--meta); }

    .state-toggles {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-4);
      background: color-mix(in oklab, var(--fg), transparent 94%);
      border-bottom: 1px solid var(--border);
      margin-bottom: var(--space-6);
      border-radius: var(--radius-sm);
      flex-wrap: wrap;
    }
    .state-toggles .toggle-label {
      font-family: var(--font-body);
      font-size: var(--text-xs);
      font-weight: 400;
      color: var(--fg-2);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-right: var(--space-3);
    }
    .state-toggles button {
      padding: var(--space-1) var(--space-3);
      font-family: var(--font-body);
      font-size: var(--text-xs);
      font-weight: 400;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--fg-2);
      cursor: pointer;
      transition: all 120ms ease;
    }
    .state-toggles button:hover {
      border-color: var(--border);
      color: var(--fg);
    }
    .state-toggles button.active {
      background: var(--accent);
      color: var(--accent-on);
      border-color: var(--accent);
    }

    .skeleton-block {
      background: linear-gradient(
        90deg,
        color-mix(in oklab, var(--fg), transparent 94%) 25%,
        var(--border-soft) 50%,
        color-mix(in oklab, var(--fg), transparent 94%) 75%
      );
      background-size: 200% 100%;
      animation: skeleton-pulse 1.5s ease-in-out infinite;
      border-radius: var(--radius-sm);
    }
    @keyframes skeleton-pulse {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .toast {
      position: fixed;
      bottom: var(--space-6);
      right: var(--space-6);
      padding: var(--space-3) var(--space-5);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--accent-on);
      z-index: 200;
      animation: toast-in 200ms ease;
    }
    .toast-success { background: var(--success); }
    .toast-error { background: var(--danger); }
    .toast-info { background: var(--info); }

    @keyframes toast-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* =================================================================
       SCREEN-SPECIFIC CSS — Supplier Profile + list screens
       ================================================================= */

    .screen-supplier { display: flex; flex-direction: column; gap: var(--space-6); }

    .supplier-header { margin-bottom: var(--space-2); }
    .supplier-header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-4);
      margin-bottom: var(--space-5);
      flex-wrap: wrap;
    }
    .supplier-header-actions {
      display: flex;
      gap: var(--space-3);
      flex-shrink: 0;
      align-items: center;
    }
    .supplier-header h1 { margin-bottom: var(--space-2); }
    .supplier-header .subtitle { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }

    .supplier-meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: var(--space-4);
      padding-top: var(--space-4);
      border-top: 1px solid var(--border);
    }
    .meta-item { display: flex; flex-direction: column; gap: var(--space-1); }
    .meta-label {
      font-family: var(--font-body);
      font-size: var(--text-xs);
      font-weight: 400;
      color: var(--meta);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .meta-value {
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--fg);
    }
    .meta-value.mono { font-family: var(--font-mono); letter-spacing: -0.01em; }

    .kpi-value .kpi-suffix { font-size: var(--text-lg); color: var(--meta); font-weight: 400; margin-left: var(--space-1); }
    .kpi-sub { display: inline-flex; align-items: center; gap: var(--space-2); margin-top: var(--space-2); }
    .kpi-sub .badge { font-weight: 600; }

    .section-title {
      font-family: var(--font-display);
      font-size: var(--text-lg);
      font-weight: 600;
      color: var(--fg);
      margin-bottom: var(--space-4);
    }
    .card + .card-margin-top,
    .block-gap { margin-top: var(--space-8); }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: var(--space-4);
    }

    /* Risk band visualization */
    .risk-band-wrap { display: flex; flex-direction: column; gap: var(--space-5); }
    .risk-score-row { display: flex; align-items: baseline; gap: var(--space-2); }
    .risk-score-number { font-family: var(--font-display); font-size: var(--text-4xl); font-weight: 700; color: var(--fg); line-height: var(--leading-tight); }
    .risk-score-max { font-family: var(--font-body); font-size: var(--text-lg); color: var(--meta); }
    .risk-band-caption { font-family: var(--font-body); font-size: var(--text-sm); color: var(--fg-2); margin-top: var(--space-1); }

    .risk-band {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .risk-band-segment {
      padding: var(--space-3) var(--space-2);
      text-align: center;
      font-family: var(--font-body);
      font-size: var(--text-xs);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: color-mix(in oklab, var(--meta), transparent 90%);
      color: var(--fg-2);
      transition: background 150ms ease, color 150ms ease;
      border-right: 1px solid var(--border);
    }
    .risk-band-segment:last-child { border-right: none; }
    .risk-band-segment.low.active    { background: color-mix(in oklab, var(--success), transparent 72%); color: var(--success); }
    .risk-band-segment.medium.active { background: color-mix(in oklab, var(--info), transparent 72%); color: var(--info); }
    .risk-band-segment.high.active   { background: color-mix(in oklab, var(--warn), transparent 68%); color: var(--warn); }
    .risk-band-segment.critical.active { background: color-mix(in oklab, var(--danger), transparent 68%); color: var(--danger); }
    .risk-band-segment .seg-range { display: block; font-weight: 400; font-size: 10px; opacity: 0.85; margin-top: var(--space-1); }
    .risk-band-marker {
      height: 4px;
      border-radius: var(--radius-pill);
      background: var(--fg-2);
      position: relative;
    }
    .risk-band-marker::after {
      content: '';
      position: absolute;
      top: -3px;
      width: 3px;
      height: 10px;
      border-radius: var(--radius-pill);
      background: var(--secondary);
      transform: translateX(-1px);
    }

    /* Risk factors */
    .factor-list { display: flex; flex-direction: column; gap: var(--space-3); }
    .factor-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); }
    .factor-name { font-family: var(--font-body); font-size: var(--text-sm); color: var(--fg); }
    .factor-weight {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      color: var(--meta);
      width: 48px;
      text-align: right;
    }

    /* Timeline */
    .timeline { position: relative; padding-left: var(--space-6); }
    .timeline::before {
      content: '';
      position: absolute;
      left: 5px;
      top: 4px;
      bottom: 4px;
      width: 2px;
      background: var(--border-soft);
    }
    .timeline-item { position: relative; padding-bottom: var(--space-6); }
    .timeline-item:last-child { padding-bottom: 0; }
    .timeline-dot {
      position: absolute;
      left: calc(-1 * var(--space-6) + 1px);
      top: 3px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid var(--surface);
      box-shadow: 0 0 0 1px var(--border-soft);
    }
    .timeline-dot.success { background: var(--success); }
    .timeline-dot.info { background: var(--info); }
    .timeline-dot.warning { background: var(--warn); }
    .timeline-dot.neutral { background: var(--meta); }
    .timeline-date { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--meta); margin-bottom: var(--space-1); }
    .timeline-title { font-family: var(--font-body); font-size: var(--text-sm); font-weight: 600; color: var(--fg); margin-bottom: var(--space-1); }
    .timeline-desc { font-family: var(--font-body); font-size: var(--text-sm); color: var(--fg-2); }

    /* State banners (empty / error / success) */
    .state-banner {
      display: flex;
      align-items: flex-start;
      gap: var(--space-4);
      padding: var(--space-5);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      margin-bottom: var(--space-6);
    }
    .state-banner.error { background: color-mix(in oklab, var(--danger), transparent 93%); border-color: color-mix(in oklab, var(--danger), transparent 78%); }
    .state-banner.success { background: color-mix(in oklab, var(--success), transparent 93%); border-color: color-mix(in oklab, var(--success), transparent 78%); }
    .state-banner.empty { background: var(--surface); }
    .state-banner-icon { font-family: var(--font-display); font-size: var(--text-2xl); font-weight: 700; line-height: 1; }
    .state-banner.error .state-banner-icon { color: var(--danger); }
    .state-banner.success .state-banner-icon { color: var(--success); }
    .state-banner.empty .state-banner-icon { color: var(--meta); }
    .state-banner-body { flex: 1; }
    .state-banner-title { font-family: var(--font-body); font-size: var(--text-base); font-weight: 600; color: var(--fg); margin-bottom: var(--space-1); }
    .state-banner-desc { font-family: var(--font-body); font-size: var(--text-sm); color: var(--fg-2); }
    .state-banner-actions { display: flex; gap: var(--space-3); align-items: center; flex-shrink: 0; }

    .empty-illustration {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-12) var(--space-6);
      gap: var(--space-3);
    }
    .empty-illustration .empty-icon {
      width: 56px; height: 56px;
      border-radius: var(--radius-pill);
      background: color-mix(in oklab, var(--accent), transparent 90%);
      color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-size: var(--text-2xl); font-weight: 700;
      margin-bottom: var(--space-2);
    }
    .empty-illustration .empty-title { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 600; color: var(--fg); }
    .empty-illustration .empty-desc { font-family: var(--font-body); font-size: var(--text-sm); color: var(--fg-2); max-width: 380px; }

    /* Skeleton helpers */
    .sk-line { height: 14px; border-radius: var(--radius-sm); }
    .sk-line.lg { height: 22px; }
    .sk-line.title { height: 28px; width: 60%; }
    .sk-line.sub { height: 14px; width: 40%; }
    .sk-block-card { height: 96px; border-radius: var(--radius-md); border: 1px solid var(--border); }
    .sk-tabs { display: flex; gap: var(--space-3); margin-bottom: var(--space-6); }
    .sk-tab { height: 18px; width: 96px; border-radius: var(--radius-sm); }
    .sk-row { height: 16px; margin-bottom: var(--space-3); border-radius: var(--radius-sm); }
    .sk-row:last-child { margin-bottom: 0; }
    .sk-header-row { display: flex; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-5); flex-wrap: wrap; }
    .sk-meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: var(--space-4); }

    .mono { font-family: var(--font-mono); }
    .muted { color: var(--meta); }
    .table-wrap { overflow-x: auto; }
    .tab-pane { animation: fade-in 150ms ease; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    /* =================================================================
       RESPONSIVE
       ================================================================= */

    @media (max-width: 768px) {
      :root {
        --page-margin: var(--space-6);
        --sidebar-width: 0;
      }
      .app-nav-top {
        padding: 0 var(--space-4);
        gap: var(--space-4);
      }
      .app-nav-sidebar {
        display: none;
      }
      .app-content-sidebar {
        padding: var(--space-4);
      }
      .kpi-grid {
        grid-template-columns: 1fr;
      }
      .supplier-header-top { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div id="app" data-od-id="app-root"></div>

  <script type="module">
    import { createApp, reactive, ref, computed, watch, nextTick } from 'vue';
    import { createRouter, createWebHashHistory } from 'vue-router';

    // =================================================================
    // Shared state + helpers
    // =================================================================

    const STATE_LIST = ['default', 'loading', 'empty', 'error', 'success'];

    // Badge tone maps (use diginex tokens via skeleton badge classes)
    const CAP_STATUS_TONE = {
      'Open': 'badge-warning',
      'In Progress': 'badge-info',
      'Closed': 'badge-success',
      'Overdue': 'badge-error',
    };
    const SEVERITY_TONE = {
      'Critical': 'badge-error',
      'High': 'badge-warning',
      'Medium': 'badge-neutral',
      'Low': 'badge-success',
    };
    const BAND_TONE = {
      'Low': 'badge-success',
      'Medium': 'badge-info',
      'High': 'badge-warning',
      'Critical': 'badge-error',
    };

    // =================================================================
    // Supplier Profile screen
    // =================================================================

    const SupplierProfile = {
      template: `
        <div class="screen-supplier" data-od-id="screen-supplier-profile">

          <div class="state-toggles" data-od-id="state-toggles">
            <span class="toggle-label">SPEC STATES:</span>
            <button
              v-for="s in states" :key="s"
              @click="setState(s)"
              :class="{ active: screenState === s }">{{ cap(s) }}</button>
          </div>

          <!-- LOADING -->
          <template v-if="screenState === 'loading'">
            <div class="sk-header-row">
              <div>
                <div class="skeleton-block sk-line title" style="width:280px"></div>
                <div class="skeleton-block sk-line sub" style="margin-top:10px;width:200px"></div>
              </div>
              <div style="display:flex;gap:12px">
                <div class="skeleton-block sk-line" style="width:72px;height:38px"></div>
                <div class="skeleton-block sk-line" style="width:130px;height:38px"></div>
              </div>
            </div>
            <div class="sk-meta-grid">
              <div v-for="i in 4" :key="i">
                <div class="skeleton-block sk-line" style="width:60px;margin-bottom:8px"></div>
                <div class="skeleton-block sk-line" style="width:120px"></div>
              </div>
            </div>
            <div class="kpi-grid">
              <div v-for="i in 4" :key="i" class="sk-block-card"></div>
            </div>
            <div class="card">
              <div class="sk-tabs">
                <div v-for="i in 5" :key="i" class="skeleton-block sk-tab"></div>
              </div>
              <div v-for="i in 5" :key="i" class="skeleton-block sk-row" :style="{ width: (70 + i*5) + '%' }"></div>
            </div>
          </template>

          <!-- ERROR -->
          <template v-else-if="screenState === 'error'">
            <div class="state-banner error" data-od-id="error-banner">
              <span class="state-banner-icon">!</span>
              <div class="state-banner-body">
                <div class="state-banner-title">Failed to load supplier profile</div>
                <div class="state-banner-desc">We couldn't fetch the profile for Acme Textiles Ltd. Check your connection and try again. If the problem persists, contact your workspace admin.</div>
              </div>
              <div class="state-banner-actions">
                <button class="btn btn-default" @click="retry">Retry</button>
              </div>
            </div>
          </template>

          <!-- EMPTY -->
          <template v-else-if="screenState === 'empty'">
            <header class="screen-header supplier-header" data-od-id="supplier-header">
              <h1>{{ supplier.legalName }}</h1>
              <p class="subtitle">{{ supplier.businessType }} · {{ supplier.country }}</p>
            </header>
            <div class="card" data-od-id="empty-state">
              <div class="empty-illustration">
                <div class="empty-icon">0</div>
                <div class="empty-title">No assessment data yet</div>
                <div class="empty-desc">This supplier has been added to the supply chain but no risk assessment has been performed. Start the first assessment to generate a risk score, identify facilities, and open CAPs.</div>
                <div style="display:flex;gap:12px;margin-top:8px">
                  <button class="btn btn-primary" @click="startFirstAssessment">Start first assessment</button>
                  <button class="btn btn-ghost" @click="screenState = 'default'">View sample data</button>
                </div>
              </div>
            </div>
          </template>

          <!-- DEFAULT + SUCCESS -->
          <template v-else>
            <div v-if="screenState === 'success'" class="state-banner success" data-od-id="success-banner">
              <span class="state-banner-icon">✓</span>
              <div class="state-banner-body">
                <div class="state-banner-title">Risk assessment completed</div>
                <div class="state-banner-desc">Annual review submitted for Acme Textiles Ltd. Risk score updated to 72/100 (High). 3 CAPs generated and assigned to the supplier.</div>
              </div>
              <div class="state-banner-actions">
                <button class="btn btn-ghost" @click="screenState = 'default'">Dismiss</button>
              </div>
            </div>

            <!-- Supplier header -->
            <header class="screen-header supplier-header" data-od-id="supplier-header">
              <div class="supplier-header-top">
                <div>
                  <h1>{{ supplier.legalName }}</h1>
                  <p class="subtitle">
                    <span>{{ supplier.businessType }}</span>
                    <span class="badge badge-neutral">{{ supplier.country }}</span>
                    <span class="badge badge-error">High risk</span>
                  </p>
                </div>
                <div class="supplier-header-actions">
                  <button class="btn btn-ghost" @click="showInfoToast('Editing supplier details is available in the full application.')">Edit</button>
                  <button class="btn btn-primary" @click="runAssessment" :disabled="assessing">{{ assessing ? 'Assessing…' : 'New assessment' }}</button>
                </div>
              </div>
              <div class="supplier-meta">
                <div class="meta-item"><span class="meta-label">Legal name</span><span class="meta-value">{{ supplier.legalName }}</span></div>
                <div class="meta-item"><span class="meta-label">Registered ID (LEI)</span><span class="meta-value mono">{{ supplier.lei }}</span></div>
                <div class="meta-item"><span class="meta-label">Country</span><span class="meta-value">{{ supplier.country }}</span></div>
                <div class="meta-item"><span class="meta-label">Business type</span><span class="meta-value">{{ supplier.businessType }}</span></div>
                <div class="meta-item"><span class="meta-label">Website</span><span class="meta-value">{{ supplier.website }}</span></div>
                <div class="meta-item"><span class="meta-label">Founded</span><span class="meta-value">{{ supplier.founded }}</span></div>
                <div class="meta-item"><span class="meta-label">Employees</span><span class="meta-value">{{ supplier.employees }}</span></div>
                <div class="meta-item"><span class="meta-label">Last audit</span><span class="meta-value">{{ supplier.lastAudit }}</span></div>
              </div>
            </header>

            <!-- KPI cards -->
            <div class="kpi-grid" data-od-id="kpi-grid">
              <div class="kpi-card">
                <span class="kpi-value">{{ kpis.risk.value }}<span class="kpi-suffix">{{ kpis.risk.suffix }}</span></span>
                <span class="kpi-label">Risk score</span>
                <span class="kpi-sub"><span class="badge" :class="BAND_TONE['High']">High</span></span>
                <span class="kpi-change down">+7 vs last assessment</span>
              </div>
              <div class="kpi-card">
                <span class="kpi-value">{{ kpis.openCaps }}</span>
                <span class="kpi-label">Open CAPs</span>
                <span class="kpi-change down">+1 this month</span>
              </div>
              <div class="kpi-card">
                <span class="kpi-value">{{ kpis.facilities }}</span>
                <span class="kpi-label">Facilities</span>
                <span class="kpi-change neutral">across {{ kpis.facilities }} sites</span>
              </div>
              <div class="kpi-card">
                <span class="kpi-value">{{ kpis.lastAudit }}</span>
                <span class="kpi-label">Last audit</span>
                <span class="kpi-change neutral">Annual cycle</span>
              </div>
            </div>

            <!-- Tabs -->
            <div class="tabs" data-od-id="profile-tabs">
              <button
                v-for="t in tabs" :key="t.key"
                class="tab" :class="{ active: activeTab === t.key }"
                @click="activeTab = t.key">{{ t.label }}</button>
            </div>

            <!-- OVERVIEW -->
            <div v-if="activeTab === 'overview'" class="tab-pane" data-od-id="tab-overview">
              <div class="card" style="margin-bottom: var(--space-8)">
                <div class="section-title">Supplier details</div>
                <div class="details-grid">
                  <div class="meta-item"><span class="meta-label">Legal name</span><span class="meta-value">{{ supplier.legalName }}</span></div>
                  <div class="meta-item"><span class="meta-label">LEI</span><span class="meta-value mono">{{ supplier.lei }}</span></div>
                  <div class="meta-item"><span class="meta-label">Country</span><span class="meta-value">{{ supplier.country }}</span></div>
                  <div class="meta-item"><span class="meta-label">Business type</span><span class="meta-value">{{ supplier.businessType }}</span></div>
                  <div class="meta-item"><span class="meta-label">Website</span><span class="meta-value">{{ supplier.website }}</span></div>
                  <div class="meta-item"><span class="meta-label">Founded</span><span class="meta-value">{{ supplier.founded }}</span></div>
                  <div class="meta-item"><span class="meta-label">Employees</span><span class="meta-value">{{ supplier.employees }}</span></div>
                  <div class="meta-item"><span class="meta-label">Onboarded</span><span class="meta-value">{{ supplier.onboarded }}</span></div>
                </div>
              </div>
              <div class="card" data-od-id="card-relationships">
                <div class="section-title">Supply chain relationships</div>
                <div class="table-wrap">
                  <table class="data-table">
                    <thead>
                      <tr>
                        <th>Party</th>
                        <th>Role</th>
                        <th>Country</th>
                        <th>ISIC Rev 5 activity</th>
                        <th>Tier</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr v-for="(r, i) in relationships" :key="i">
                        <td>{{ r.party }}</td>
                        <td>{{ r.role }}</td>
                        <td>{{ r.country }}</td>
                        <td><span class="mono">{{ r.isic }}</span></td>
                        <td><span class="badge badge-neutral">{{ r.tier }}</span></td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <!-- FACILITIES -->
            <div v-else-if="activeTab === 'facilities'" class="tab-pane" data-od-id="tab-facilities">
              <div class="card" data-od-id="card-facilities">
                <div class="section-title">Facilities ({{ facilities.length }})</div>
                <div class="table-wrap">
                  <table class="data-table">
                    <thead>
                      <tr>
                        <th v-for="col in facilityCols" :key="col.key"
                            :class="{ sorted: sortKey === col.key }"
                            @click="sortBy(col.key)">
                          {{ col.label }}<span v-if="sortKey === col.key">{{ sortDir === 'asc' ? ' ▲' : ' ▼' }}</span>
                        </th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr v-for="(f, i) in sortedFacilities" :key="i">
                        <td>{{ f.facility }}</td>
                        <td>{{ f.location }}</td>
                        <td><span class="badge badge-info">{{ f.role }}</span></td>
                        <td><span class="mono">{{ f.isic }}</span></td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <!-- RISK ASSESSMENT -->
            <div v-else-if="activeTab === 'risk'" class="tab-pane" data-od-id="tab-risk">
              <div style="display:grid;grid-template-columns:1fr;gap:var(--space-8)">
                <div class="card" data-od-id="card-risk-band">
                  <div class="section-title">Risk band</div>
                  <div class="risk-band-wrap">
                    <div class="risk-score-row">
                      <span class="risk-score-number">{{ riskScore }}</span>
                      <span class="risk-score-max">/ 100</span>
                    </div>
                    <div class="risk-band">
                      <div v-for="b in riskBands" :key="b.key"
                           class="risk-band-segment" :class="[b.key, { active: b.key === riskBand }]">
                        {{ b.label }}<span class="seg-range">{{ b.range }}</span>
                      </div>
                    </div>
                    <div class="risk-band-marker" :style="{ '--p': riskScore + '%' }"></div>
                    <p class="risk-band-caption">Current band: <strong>High</strong> · last assessed {{ lastAssessed }} by {{ lastReviewer }}.</p>
                  </div>
                </div>

                <div class="card" data-od-id="card-risk-factors">
                  <div class="section-title">Contributing risk factors</div>
                  <div class="factor-list">
                    <div class="factor-row" v-for="(fac, i) in riskFactors" :key="i">
                      <div style="display:flex;align-items:center;gap:10px">
                        <span class="status-dot" :class="fac.severity === 'High' ? 'error' : fac.severity === 'Medium' ? 'warning' : 'neutral'"></span>
                        <span class="factor-name">{{ fac.name }}</span>
                      </div>
                      <span class="badge" :class="SEVERITY_TONE[fac.severity]">{{ fac.severity }}</span>
                      <span class="factor-weight">{{ fac.weight }}</span>
                    </div>
                  </div>
                </div>

                <div class="card" data-od-id="card-assessment-history">
                  <div class="section-title">Assessment history</div>
                  <div class="table-wrap">
                    <table class="data-table">
                      <thead>
                        <tr>
                          <th>Date</th>
                          <th>Type</th>
                          <th>Score</th>
                          <th>Band</th>
                          <th>Reviewed by</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr v-for="(a, i) in assessments" :key="i">
                          <td><span class="mono">{{ a.date }}</span></td>
                          <td>{{ a.type }}</td>
                          <td><strong>{{ a.score }}</strong></td>
                          <td><span class="badge" :class="BAND_TONE[a.band]">{{ a.band }}</span></td>
                          <td>{{ a.reviewer }}</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>

    ];

    // =================================================================
    // ROUTER + APP

    const router = createRouter({
      history: createWebHashHistory(),
      routes,
    });

    const App = {

      setup() {

    const app = createApp(App);
    app.use(router);
    app.mount('#app');
  </script>
