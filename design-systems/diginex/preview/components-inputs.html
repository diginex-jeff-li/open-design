<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Diginex — Inputs</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Open+Sans:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<style>
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); }
  .wrap { max-width: 560px; margin: 0 auto; padding: var(--space-12) var(--container-gutter-desktop); }
  h1 { font-family: var(--font-display); font-weight: 600; font-size: var(--text-3xl); margin: 0 0 var(--space-8); }
  .field { display: flex; flex-direction: column; gap: var(--space-1); margin-bottom: var(--space-5); }
  label { font-size: var(--text-sm); font-weight: 500; color: var(--fg); }
  .input, textarea, select { padding: var(--space-2) var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg); color: var(--fg); font-size: var(--text-sm); font-family: var(--font-body); }
  .input:focus, textarea:focus, select:focus { outline: none; box-shadow: var(--focus-ring); border-color: var(--accent); }
  .hint { font-size: var(--text-xs); color: var(--meta); }
  .err { font-size: var(--text-xs); color: var(--danger); }
  .input.err-in { border-color: var(--danger); }
  .check { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); }
  input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Inputs</h1>

    <div class="field">
      <label for="name">Project name</label>
      <input id="name" class="input" type="text" placeholder="Diginex Library" />
      <span class="hint">Focus shows the violet brand ring.</span>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" class="input" type="email" placeholder="you@diginex.io" />
    </div>

    <div class="field">
      <label for="role">Role</label>
      <select id="role"><option>Owner</option><option>Editor</option><option>Viewer</option></select>
    </div>

    <div class="field">
      <label for="notes">Notes</label>
      <textarea id="notes" rows="3" placeholder="Optional context"></textarea>
    </div>

    <div class="field">
      <label for="bad">Invalid value</label>
      <input id="bad" class="input err-in" type="text" value="not-a-token" />
      <span class="err">This field has an error.</span>
    </div>

    <label class="check"><input type="checkbox" checked /> Use Lilac-3 as primary</label>
  </div>
</body>
</html>
